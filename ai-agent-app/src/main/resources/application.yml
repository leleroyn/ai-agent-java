server:
  port: 8080

spring:
  application:
    name: ai-agent-java

  # Credentials come from the environment only (see .env.example). Never commit a password.
  # Note: verified against MySQL 5.7.36 with Connector/J 9.7.0 (Spring Boot 4 managed version).
  datasource:
    url: jdbc:mysql://${DB_HOST:192.168.2.190}:${DB_PORT:3306}/${DB_NAME:agent}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:16}
      connection-timeout: 10000

  # Create agent_task if absent. Idempotent (CREATE TABLE IF NOT EXISTS).
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false

# Keep AgentScope's own auto-configured singleton agent OFF: this service builds
# one ReActAgent per task (each task carries its own schema / tools / permission).
agentscope:
  agent:
    enabled: false

agent:
  # 主模型 profile：task 可通过请求里的 model 字段选一个；未指定用 default-model。
  # 两个 profile 完全独立、无共享属性，各自自由设定。未知 profile 名会在提交时拒绝。
  default-model: ${AGENT_DEFAULT_MODEL:flash}
  # 抽取/QA 的纯文本子调用用哪个 profile（agent.models.*）。OCR 之后手上只剩文本，
  # 用文本模型明显更准：同一份营业执照 OCR 文本，视觉端点 6 字段稳定漏 1 个，pro 全对。
  # 留空=回退视觉端点（旧行为）。
  text-model: ${AGENT_TEXT_MODEL:pro}
  models:
    # flash：小快模型（llama.cpp :8007，minicpm）。实测 n_ctx=4096（2026-10-21 复测 /v1/models
    # 报 4096）、total_slots=1（串行），只适合短上下文、简单任务；复杂/多图/长文档任务应用 pro。
    flash:
      base-url: ${AGENT_FLASH_BASE_URL:http://192.168.1.250:8007/v1}
      api-key: ${AGENT_FLASH_API_KEY:local}
      name: ${AGENT_FLASH_MODEL_NAME:minicpm}
      native-structured-output-with-tools: ${AGENT_FLASH_NATIVE_SO_WITH_TOOLS:false}
      native-structured-output: ${AGENT_FLASH_NATIVE_SO:true}
      structured-output-mode: ${AGENT_FLASH_STRUCTURED_OUTPUT:two_phase}
      reasoning-effort: ${AGENT_FLASH_REASONING_EFFORT:none}
      max-tokens: ${AGENT_FLASH_MAX_TOKENS:2048}
      # two_phase 第二阶段（自由文本→JSON）的输出预算；留空=沿用上一行 max-tokens。
      # 大 schema 必须从这里放开：输出被截断时 strata 端点直接 502 structured_output_failed，
      # llama.cpp 是 HTTP 200 带半截 JSON（finish_reason=length），两者最后都变成
      # "produced no value matching outputSchema"，真因在日志 "structured convert HTTP ..."。
      # 算术上限：schema token + 结果文本 token + 本值 <= 端点 n_ctx（实测 :8007=4096）。
      structured-max-tokens: ${AGENT_FLASH_STRUCTURED_MAX_TOKENS:${AGENT_FLASH_MAX_TOKENS:2048}}
      temperature: ${AGENT_FLASH_TEMPERATURE:0.6}
      context-window-size: ${AGENT_FLASH_CONTEXT_WINDOW:8192}
      strata-checkpoint: ${AGENT_FLASH_STRATA_CHECKPOINT:}
    # pro：大上下文模型（llama.cpp :8009，qwen，n_ctx=200192、4 slots）。默认不用，
    # 由 task 传 model:"pro" 启用；适合复杂/多图/长文档。
    pro:
      base-url: ${AGENT_PRO_BASE_URL:http://192.168.1.250:8009/v1}
      api-key: ${AGENT_PRO_API_KEY:local}
      name: ${AGENT_PRO_MODEL_NAME:qwen}
      # llama.cpp 把 tools 与 response_format:json_schema 同时发会 400，故 with-tools=false；
      # 带图+schema 靠 two_phase（先跑工具、再转 JSON）。
      native-structured-output-with-tools: ${AGENT_PRO_NATIVE_SO_WITH_TOOLS:false}
      native-structured-output: ${AGENT_PRO_NATIVE_SO:true}
      structured-output-mode: ${AGENT_PRO_STRUCTURED_OUTPUT:two_phase}
      reasoning-effort: ${AGENT_PRO_REASONING_EFFORT:none}
      max-tokens: ${AGENT_PRO_MAX_TOKENS:131072}
      # 同上；pro 端点 n_ctx=204800（实测），大 schema 走这条。300 字段 schema 实测：
      # 输入 43621 token + 输出 21020 token 正常，耗时 168 秒（所以第二阶段的 HTTP 超时
      # 取任务剩余墙钟，不再固定 120 秒）。
      structured-max-tokens: ${AGENT_PRO_STRUCTURED_MAX_TOKENS:${AGENT_PRO_MAX_TOKENS:131072}}
      temperature: ${AGENT_PRO_TEMPERATURE:1.0}
      context-window-size: ${AGENT_PRO_CONTEXT_WINDOW:131072}
      strata-checkpoint: ${AGENT_PRO_STRATA_CHECKPOINT:}

  # 独立的视觉（多模态）模型，只给 understand_document 的看图通道用
  # （看图关掉时走 OCR 文本，压根不碰这个端点）。没有「开关视觉端点」的配置项：
  # 端点不可达时 understand_document 直接返回 Error。
  # 图片字节只到这里，绝不进主模型的上下文——主模型保持纯文本。
  # 该端点必须是带 mmproj 的真 VL 模型；不带 mmproj 的会直接返回
  # "500 image input is not supported ... provide the mmproj"。
  vision:
    base-url: ${AGENT_VISION_BASE_URL:http://192.168.1.250:8008/v1}
    api-key: ${AGENT_VISION_API_KEY:local}
    name: ${AGENT_VISION_MODEL_NAME:qwenvl}
    max-images: ${AGENT_VISION_MAX_IMAGES:8}
    max-image-bytes: ${AGENT_VISION_MAX_IMAGE_BYTES:8388608}
    timeout-seconds: ${AGENT_VISION_TIMEOUT:120}
    temperature: ${AGENT_VISION_TEMPERATURE:0.0}
    # 视觉模型推理强度：none 关闭思考（llama.cpp 走 chat_template_kwargs.enable_thinking）；留空则不下发。
    reasoning-effort: ${AGENT_VISION_REASONING_EFFORT:none}
    # 视觉模型最大输出 token；留空=不下发（用后端默认）。
    max-tokens: ${AGENT_VISION_MAX_TOKENS:}

  runner:
    name: task-agent
    # "Use a tool only when..." is load-bearing: with all tools registered, a self-contained
    # instruction still made the agent go hunting through the filesystem until it timed out.
    sys-prompt: >
      你是自动化任务代理，无人在线，禁止提问。
      规则：
      - 指令自包含时直接回答，不调工具；但指令里出现文件 URL 或文件路径时不算自包含：文件内容只能来自工具返回，禁止凭记忆或猜测写出字段值。
      - 你不能看图/PDF/TXT，绝对禁止 read-file 或 shell 打印图片/PDF/TXT内容；只能用专用工具处理。
      - 文档来源只能是本任务工作目录下的本地路径：指令里点名的文件已在任务启动前下载到 src/ 下，
        指令里写的就是可直接使用的路径，原样传给工具即可。
      - 要字段值 → extract_document_fields；要开放理解 → understand_document。
      - 任务是"找特定信息"时优先用 extract_document_fields。
      - 每个目标只调一次工具，第一次返回即权威，不得重复调用确认。
      - extract_document_fields 的 value 就是权威结论：同一字段只会给一条 value，其余候选在 alternates 里，以 value 为准，不要自己挑。
      - 抽取类任务调一次 extract_document_fields 就结束了：value=null 表示全文已遍历、已按语义匹配过别名，
        这就是终局结论。绝对禁止为了补 null 字段去调 understand_document，也禁止换个字段名再抽一遍。
      - 指令里出现 身份证/居民身份证→技能 idcard-recognition，印章/公章/盖章/红章/骑缝章→seal-recognition，
        发票/增值税发票→invoice-recognition，营业执照→bizlic-recognition。命中几类就是几类，互不排斥。
        命中技能的任务，其正文已被服务放在本条消息开头（见「已加载的技能规范」）：直接照正文执行命令，
        不要再调 load_skill_through_path 加载同一个技能；只有本条消息里没有技能正文时，才加载对应技能名。
      - 命中多类时每一类都要各自跑出结论才允许收尾：每类跑它正文里那条命令（镜像内置 ips CLI），
        一条命令一个文件、多个文件逐条执行。全部命中类型的命令跑出结果之前，
        extract_document_fields 与 understand_document 对本任务禁用（图片和 PDF 都不例外）；
        收尾时把各类字段合并进同一个 JSON 对象。
      - 只跑指令点到的类型：没提印章就不要跑 ips seal，没提发票就不要跑 ips invoice，命中几类只跑那几类。
        同一文件同一条命令只跑一次（服务端有缓存，重跑结论完全一样，只是白烧一轮迭代）。
      - 工作目录就是本任务目录：命令直接写 ips …（来源用 src/ 下的相对路径），禁止 cd、ls、find 这类探路命令，
        也不需要拼绝对路径。
      - 这四类的结论只来自技能通道，它返回的就是权威结论：技能报「未检出」就是那一类的终局，
        不得因为没检出就换通用工具再查，也不得换字段名重试。
      - 技能正文写明「PDF 不支持」的那几类，来源只有 PDF 时照正文改走通用抽取，并在结果里说明用的是通用通道。
      - 工具不接受 URL：绝对禁止用 shell 下载文件，也不要把指令里的 URL 或自己拼的 URL 当来源传进去；
        工具会直接报错，白烧一轮。
      - 涉及日期/时间必须调 get_system_time，禁止凭记忆推断。
      - 信息够了就输出结果并停止。
      - 指令要求 JSON/结构化输出时，最终答案只输出 JSON 本身：不加解释、不加前后缀、不用 Markdown 代码围栏。
    max-iters: ${AGENT_MAX_ITERS:20}
    # 指令里点名了文档文件、但整趟运行一个工具都没调 —— 答案只可能来自模型记忆（实测营业执照
    # 任务 1.6s 返回了另一家公司的字段）。默认重试一次，仍不调工具就失败，绝不把编造值当结果。
    force-document-tool: ${AGENT_FORCE_DOCUMENT_TOOL:true}
    # BYPASS is required for the "all tools" decision: in DONT_ASK mode every ASK
    # decision is demoted to DENY, which would silently block shell/write.
    # Deny rules and dangerous-path checks still apply even under BYPASS.
    # RISK: combined with no authentication, this exposes remote command execution.
    # The container filesystem is the security boundary. Set to DONT_ASK or EXPLORE
    # to harden, or add an auth layer before exposing this service.
    permission-mode: ${AGENT_PERMISSION_MODE:BYPASS}

  execution:
    # 异步通道 worker 数：每个线程一次跑 1 个任务，直接认领 MySQL，所以这就是精确的异步并发数，
    # 不存在重启会丢活的内存队列。同步行不由这些线程认领（见 sync-concurrency）。
    # 旧键 AGENT_MAX_CONCURRENT 只作兜底（新键缺失时才生效），新配置一律写 AGENT_ASYNC_CONCURRENCY。
    async-concurrency: ${AGENT_ASYNC_CONCURRENCY:${AGENT_MAX_CONCURRENT:1}}
    # 同步通道 worker 数：与异步通道一样常驻，空闲时每 worker 每 max-poll-backoff-seconds 一条索引查询。
    # 0 = 关闭同步通道，同步行退回异步线程认领（排在异步前面）。
    sync-concurrency: ${AGENT_SYNC_CONCURRENCY:1}
    default-timeout-seconds: ${AGENT_DEFAULT_TIMEOUT:120}
    max-timeout-seconds: ${AGENT_MAX_TIMEOUT:900}
    # A claim is valid for this long and is renewed while the task runs. If the process dies the
    # lease lapses and the task is handed back to the queue instead of being lost.
    lease-seconds: ${AGENT_LEASE_SECONDS:90}
    lease-reap-seconds: ${AGENT_LEASE_REAP_SECONDS:30}
    # Total claims allowed per task before it is failed with AGENT_LEASE_EXPIRED.
    max-attempts: ${AGENT_MAX_ATTEMPTS:2}
    # 队列空时 worker 停在信号上，本地提交立刻唤醒；下面的超时只兜底跨实例提交和 reaper 重入队。
    # poll-interval-ms 现在只用于 DB 出错后的重试间隔。
    poll-interval-ms: ${AGENT_POLL_INTERVAL_MS:250}
    max-poll-backoff-seconds: ${AGENT_POLL_BACKOFF_SECONDS:3}
    claim-peek: 5
    # Backpressure: refuse new submissions beyond this many still-queued tasks. 0 disables.
    max-queued-tasks: ${AGENT_MAX_QUEUED_TASKS:1000}

  # PDF：需要 OCR 的页（含图片的页，或文字层几乎没有中日韩文字的页）走 OCR 文本通道（见 agent.ips），其余页取文字层；OCR 不可用时回退视觉模型。
  # TXT：分块纯文本调模型。服务端遍历整篇保召回。
  pdfs:
    enabled: ${AGENT_PDF_ENABLED:true}
    # 每批交给视觉模型的页数（understand_document 单次上限；extract_document_fields 每批页数）。
    # 实际上限 = min(本值, agent.vision.max-images)。
    pages-per-call: ${AGENT_PDF_PAGES_PER_CALL:6}
    # 抽取阶段（分块调模型）的并发批数。
    concurrency: ${AGENT_PDF_CONCURRENCY:4}
    # 扫描版 PDF 逐页 OCR 的并发 worker 数；写入仍严格按页序，并发只发生在识别阶段，
    # 页数 <= 2 时始终串行。OCR 单页慢（PDF 走 mix、图片走 md），这里调高可以把 72 页那份的时间补回来。
    ocr-parallelism: ${AGENT_PDF_OCR_PARALLELISM:2}
    # understand_document 分批理解 PDF 的并发批数；结果仍按批序归并，并发只影响耗时。
    understand-parallelism: ${AGENT_PDF_UNDERSTAND_PARALLELISM:2}
    # 抽取类任务最多 OCR 多少页（成本兜底）；超过只识别前 N 页，并在 txt 末尾注明共几页。
    max-pages: ${AGENT_PDF_MAX_PAGES:200}
    # 栅格化最长边像素（控 token；0=不缩放）。pdftoppm -scale-to。
    max-image-dimension: ${AGENT_PDF_MAX_DIM:1568}
    jpeg-quality: ${AGENT_PDF_JPEG_QUALITY:85}
    # 单次 VL 调用超时（秒）。
    timeout-seconds: ${AGENT_PDF_TIMEOUT:120}
    # PDF 下载体积上限（字节），防 DoS。
    max-download-bytes: ${AGENT_PDF_MAX_DOWNLOAD_BYTES:209715200}
    # TXT 分块大小（字符）/ 重叠（防字段截断在块边界）。
    # 分块大小按抽取端点上下文定：qwenvl n_ctx=131072，40000 个中日韩字符约 4 万 token，
    # 输入输出都还有余量（实测 72 页那份 7 万字符切成 2 块，甲方/乙方/金额/订立时间全对）。
    # 块越大越少跨块丢字段、也越少归并时的互斥候选；OCR 文本有页标记，切分不会劈开字段值。
    text-chunk-size: ${AGENT_PDF_TEXT_CHUNK_SIZE:40000}
    # 页边界打包用不到重叠；退回字符窗口时留一点，避免正好劈开一个值。
    text-chunk-overlap: ${AGENT_PDF_TEXT_CHUNK_OVERLAP:400}
    # SSRF 主机白名单（后缀匹配）；留空=允许任意 http/https（与图片工具一致）。
    # 约束任务启动前的文件下载（SourceIngestor）——工具层已不再下载任何 URL，只剩这一条通道。
    # 环境变量 AGENT_PDF_SSRF_ALLOWLIST（逗号分隔）。
    # 之前这里只有注释、没有绑定，.env.example 里写的那个键实际上拿不到。
    ssrf-allowlist: ${AGENT_PDF_SSRF_ALLOWLIST:}

  # 综合服务平台（IPS）：同一台服务、同一个基址。
  #   POST /api/v3/ocr/preprocess      抽取类任务的统一文本通道（图片与 PDF 一律先 OCR 换文本）
  #   POST /api/v3/seal/preprocess     印章识别——技能 seal-recognition 经镜像内置 ips CLI
  #   POST /api/v3/invoice/preprocess  发票识别——技能 invoice-recognition 经镜像内置 ips CLI
  #   POST /api/v3/idcard/preprocess   身份证识别——技能 idcard-recognition，同上（只收图片）
  #   POST /api/v3/bizlic/preprocess   营业执照识别——技能 bizlic-recognition，同上（只收图片）
  # base-url 留空 = OCR 不可用，抽取无法进行；CLI 侧 IPS_BASE_URL 由 scripts/docker-run.sh 同源注入。
  # OCR 一页一请求（服务端按页拼接会丢空白页、页码对不上）；PDF 的页级并发在 agent.pdfs.ocr-parallelism。
  ips:
    enabled: ${AGENT_IPS_ENABLED:true}
    base-url: ${AGENT_IPS_BASE_URL:http://127.0.0.1:8000}
    # 印章/发票/身份证/营业执照不在 Java 侧调用：由镜像内置 ips CLI 走，CLI 自带 --timeout 默认 180s；
    # 想把它和本键绑成一个旋钮，scripts/docker-run.sh 会把本值注入成容器里的 IPS_TIMEOUT_SECONDS。
    # ---- OCR 接口 ----
    ocr-timeout-seconds: ${AGENT_IPS_OCR_TIMEOUT:120}
    # OCR 栅格化 dpi / 最长边像素上限（0=不缩放，保识别分辨率）/ JPEG 质量。
    rasterize-dpi: ${AGENT_IPS_RASTERIZE_DPI:300}
    max-image-dimension: ${AGENT_IPS_MAX_DIM:0}
    jpeg-quality: ${AGENT_IPS_JPEG_QUALITY:90}
    # 表单参数：resize=服务端缩放（快）；use_cls=方向检测（慢）。
    resize: ${AGENT_IPS_RESIZE:true}
    use-cls: ${AGENT_IPS_USE_CLS:false}
    # 渠道标识，便于服务端统计；留空=不下发。
    app-id: ${AGENT_IPS_APP_ID:ai-agent-java}
  tools:
    # Decision: expose all built-in tools. Requires permission-mode BYPASS.
    shell: ${AGENT_TOOL_SHELL:true}
    # read-file 一个开关同时提供 view_text_file 和 list_directory。抽取类服务建议置 false：
    # 关掉之后模型只剩 get_system_time / extract_document_fields / understand_document，
    # 没有任何办法把 OCR 中间文件读进主模型上下文（框架的 deny 规则只能按工具名拦，做不到按路径）。
    read-file: ${AGENT_TOOL_READ:true}
    write-file: ${AGENT_TOOL_WRITE:true}
    todo: ${AGENT_TOOL_TODO:true}
    # 自定义工具：get_system_time（服务器当前时间）。默认全局开启。
    system-time: ${AGENT_TOOL_SYSTEM_TIME:true}
    # 自定义工具：understand_document（图片/PDF/TXT 自由理解）。
    document-understand: ${AGENT_TOOL_DOCUMENT_UNDERSTAND:true}
    # 自定义工具：extract_document_fields（图片/PDF/TXT 字段抽取）。
    document-extract: ${AGENT_TOOL_DOCUMENT_EXTRACT:true}
    # 看图开关：understand_document 的图片/PDF 视觉通道（图字节送到 agent.vision 的 VL 端点）。
    # false = 不看图：图片/PDF 先 OCR 成文本（.ocr/ 下同名 txt，与抽取共用同一份缓存），再交给
    # agent.text-model 问答。extract_document_fields 本来就不看图（OCR 文本通道），不受本开关影响。
    document-understand-vision: ${AGENT_TOOL_DOCUMENT_UNDERSTAND_VISION:true}

    # Sandbox root. Each task gets its own private subdirectory <working-dir>/<taskId>,
    # which is what the file tools are actually confined to.
    working-dir: ${AGENT_WORKING_DIR:./agent-workspace}
    # The ONLY cleanup switch: when true the whole task directory (src/, .ocr/, .ingest/) goes
    # away at a terminal state; when false nothing is deleted. Keep false in test to inspect
    # what the agent actually fetched and recognised; keep true in production, otherwise every
    # scan leaves tens of MB on disk forever.
    delete-workspace-on-finish: ${AGENT_DELETE_WORKSPACE_ON_FINISH:false}
    # Shell allowlist, checked PER SEGMENT (split on ; | & newline), so pipes still work.
    # Empty = no allowlist, every executable may run (subject to permission mode).
    # AGENT_SHELL_ALLOWED=ips is the "shell must not read local files" setting: only the bundled
    # ips CLI runs, cat/grep/head/python are all rejected. File tools are a separate switch
    # (AGENT_TOOL_READ) and still read inside the task directory, set that false too to close it.
    shell-allowed-commands: ${AGENT_SHELL_ALLOWED:}
    # Shell command blacklist, also per segment. An entry matches either the executable basename
    # (curl) or a path suffix (native/ips), so /opt/agent-cli/native/ips is caught as well.
    # curl/wget are denied because SourceIngestor already put every instruction file under src/ and
    # the tools only accept local paths — a second download would give the same content two
    # identities and the dedup stops working (that is what re-OCR'd a 72-page scan once).
    # /opt/agent-cli/native/ips is the unwrapped binary: denying it keeps the wrapper's
    # IPS_ALLOWED_SUBCOMMANDS gate from being bypassed with an absolute path.
    shell-denied-commands: ${AGENT_SHELL_DENIED:curl,wget,/opt/agent-cli/native/ips}

  skills:
    # Reusable skills, AgentScope-style: <location>/<name>/SKILL.md with YAML frontmatter.
    # Only name + description are injected into the prompt; the model pulls the body with
    # load_skill_through_path, so the token cost stays low until a skill is actually used.
    enabled: ${AGENT_SKILLS_ENABLED:true}
    # Skills bundled in the jar. Silently skipped when the folder is not packaged.
    classpath-location: ${AGENT_SKILLS_CLASSPATH:skills}
    # Operator directory, higher priority: a same-named skill here overrides the bundled copy.
    # Re-read per task by mtime/size, so editing a SKILL.md needs no restart.
    directory: ${AGENT_SKILLS_DIR:./agent-skills}
    lazy: ${AGENT_SKILLS_LAZY:true}
    # Lets a skill's scripts run through the shell and adds <files-root> instructions.
    # RISK: with shell enabled and no auth, anyone who can write the skills directory would get
    # code execution. Leave off unless skill authors are trusted.
    code-execution-enabled: ${AGENT_SKILLS_CODE_EXEC:false}
    max-requested: ${AGENT_SKILLS_MAX_REQUESTED:8}
    # Explicitly selected skills are injected into the prompt (deterministic, unlike waiting for
    # the model to load them). This caps how much of the context they may take.
    max-inline-chars: ${AGENT_SKILLS_MAX_INLINE_CHARS:12000}

  # 工具调用链：一趟任务里 agent 按顺序调了哪些工具、参数是什么、每次多久、成功还是失败。
  # 一条调用一行落 agent_tool_call（agent_task 的一对多子表），GET /task/{id} 的 tools 字段返回，
  # 回调 payload 同源。只记调用事实，不记返回值——OCR 全文几万字符不进库，结果在 result_json/result_text。
  # enabled=false 时不采集（调用次数照记，文档任务的工具接地判定不受影响）。
  trace:
    enabled: ${AGENT_TRACE_TOOLS:true}
    # 一趟任务最多写多少行；超出只多计数（写进日志的 toolCalls=）。max-iters 默认 20，正常远用不到。
    max-entries: ${AGENT_TRACE_MAX_ENTRIES:200}
    # 单次调用的参数截断长度：一条 shell 命令可能带一长串路径。
    max-args-chars: ${AGENT_TRACE_MAX_ARGS_CHARS:400}
    # 调用链行保留几天：每天 03:30（容器时区）删一次 created_at 早于该天数的行；0 = 不清理（行存只涨不缩）。
    retention-days: ${AGENT_TRACE_RETENTION_DAYS:30}

  limits:
    max-instruction-chars: ${AGENT_LIMIT_INSTRUCTION:32768}
    max-schema-chars: ${AGENT_LIMIT_SCHEMA:8192}
    max-metadata-chars: ${AGENT_LIMIT_METADATA:8192}

logging:
  level:
    com.jtzj.agent: INFO
    io.agentscope: INFO
